name: Refresh agenda

on:
  schedule:
    - cron: "0 5 * * *"    # ~07:00 Amsterdam (06:00 in winter)
    - cron: "0 14 * * *"   # ~16:00 Amsterdam (15:00 in winter)
  workflow_dispatch: {}     # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Quick path: a push that only touches the page design (template.html) reuses the events from the
      # last full refresh instead of downloading every source again. Scheduled and manual runs, and
      # pushes that change anything else, always do the full refresh.
      - name: Decide quick or full
        id: mode
        run: |
          fast=false
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(template\.html|README\.md)$'; then fast=true; fi
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "Quick path: $fast"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install playwright beautifulsoup4 markdownify

      - name: Install browser
        if: steps.mode.outputs.fast != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Fetch listings
        if: steps.mode.outputs.fast != 'true'
        run: python fetch.py

      - name: Build site
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          FILMMETA_MAX: ${{ steps.mode.outputs.fast == 'true' && '0' || '500' }}
          PAGE_PRICES_MAX: ${{ steps.mode.outputs.fast == 'true' && '0' || '500' }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "${OWNER}.github.io" ]; then SITE="https://${OWNER}.github.io"; else SITE="https://${OWNER}.github.io/${REPO}"; fi
          python -u build.py --out public --previous "${SITE}/events.json"

      - name: Save new venue locations and start times
        run: |
          git add venues.json
          [ -f times.json ] && git add times.json || true
          [ -f prices.json ] && git add prices.json || true
          [ -f filmmeta.json ] && git add filmmeta.json || true
          [ -f translations.json ] && git add translations.json || true
          if ! git diff --cached --quiet; then
            git config user.name "agenda-bot"
            git config user.email "agenda-bot@users.noreply.github.com"
            git commit -m "Update venue locations, start times and prices [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
